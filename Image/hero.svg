<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="桃白簪花 · mihomo 覆写脚本">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8FA"/>
      <stop offset="0.55" stop-color="#FCEAF1"/>
      <stop offset="1" stop-color="#F8DCE8"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0A8C0"/>
      <stop offset="1" stop-color="#E58BA8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <g id="blossom">
      <circle cx="0" cy="-50" r="29"/>
      <circle cx="47.6" cy="-15.5" r="29"/>
      <circle cx="29.4" cy="40.5" r="29"/>
      <circle cx="-29.4" cy="40.5" r="29"/>
      <circle cx="-47.6" cy="-15.5" r="29"/>
      <circle cx="0" cy="0" r="17" fill="#FFF1F6"/>
      <circle cx="0" cy="0" r="7" fill="#E58BA8"/>
    </g>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1015" cy="150" r="200" fill="url(#glow)"/>

  <use href="#blossom" transform="translate(1015 150)" fill="url(#petal)" opacity="0.92"/>
  <use href="#blossom" transform="translate(1150 52) scale(0.3) rotate(22)" fill="url(#petal)" opacity="0.5"/>
  <use href="#blossom" transform="translate(880 258) scale(0.24) rotate(-14)" fill="url(#petal)" opacity="0.38"/>
  <use href="#blossom" transform="translate(1096 250) scale(0.17) rotate(40)" fill="url(#petal)" opacity="0.32"/>

  <g font-family="PingFang SC, Microsoft YaHei, Hiragino Sans GB, system-ui, sans-serif">
    <text x="80" y="104" font-size="13" letter-spacing="4.5" fill="#C4819A">MIHOMO · CLASH META</text>
    <text x="80" y="170" font-size="54" font-weight="700" fill="#7A3E52" letter-spacing="2">桃白簪花</text>
    <text x="80" y="214" font-size="19" fill="#9C6478">覆写脚本与成品配置 · 让策略组一眼看懂</text>
    <line x1="80" y1="242" x2="522" y2="242" stroke="#EFC7D6" stroke-width="1"/>
    <text x="80" y="270" font-size="13" fill="#B07E90">40 枚自研图标 · 2 份成品配置 · 1 份覆写脚本</text>
  </g>
</svg>
